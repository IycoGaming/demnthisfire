name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Accept licenses
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      # Fix Gradle cache issue (IMPORTANT)
      - name: Clear Gradle cache
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/

      # Init npm properly
      - name: Init npm
        run: npm init -y

      # Install Capacitor
      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      # Prepare app
      - name: Prepare app
        run: |
          mkdir www
          cp index.html www/index.html

      # Init Capacitor (IMPORTANT)
      - name: Init Capacitor
        run: npx cap init "DSv2" "com.sanctuary.dsv2" --web-dir=www

      # Add Android
      - name: Add Android
        run: npx cap add android

      # Sync
      - name: Sync Capacitor
        run: npx cap sync android

      # Fix Gradle memory
      - name: Fix Gradle config
        run: |
          echo "org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties

      # Build APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --info

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DSv2-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
