name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Init npm
        run: npm init -y

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare app
        run: |
          mkdir www
          cp index.html www/index.html

      # 👉 Yahin change kiya hai (App Name)
      - name: Init Capacitor
        run: npx cap init "DSv2" "com.sanctuary.dsv2" --web-dir=www

      - name: Add Android
        run: npx cap add android

      - name: Sync
        run: npx cap sync

      - name: Gradle config
        run: echo "org.gradle.jvmargs=-Xmx2048m" >> android/gradle.properties

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DSv2-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
