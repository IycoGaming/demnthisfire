name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - run: yes | sdkmanager --licenses

      - name: Clear Gradle cache
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/

      - run: npm init -y
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare app
        run: |
          mkdir www
          cp index.html www/index.html

      - run: npx cap init "DSv2" "com.sanctuary.dsv2" --web-dir=www
      - run: npx cap add android
      - run: npx cap sync android

      # 🔥 FIX: Upgrade Gradle
      - name: Upgrade Gradle Wrapper
        run: |
          cd android
          ./gradlew wrapper --gradle-version 8.7

      - name: Fix Gradle config
        run: |
          echo "org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: DSv2-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
