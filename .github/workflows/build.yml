name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Accept licenses (important)
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      # Create npm project
      - name: Init npm
        run: npm init -y

      # Install Capacitor
      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      # Prepare web app
      - name: Prepare app
        run: |
          mkdir www
          cp index.html www/index.html

      # Init capacitor (APP NAME = DSv2)
      - name: Init Capacitor
        run: npx cap init "DSv2" "com.sanctuary.dsv2" --web-dir=www

      # Add Android platform
      - name: Add Android
        run: npx cap add android

      # Sync project
      - name: Sync Capacitor
        run: npx cap sync android

      # Fix Gradle memory (VERY IMPORTANT)
      - name: Fix Gradle config
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> android/gradle.properties

      # Clean build (prevents random failures)
      - name: Clean project
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean

      # Build APK with logs
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DSv2-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
